[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droid-backend"
version = "0.1.0"
description = "AI-Powered Indian F&O Market Analysis Platform - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "structlog>=24.0.0",
    "tzdata>=2024.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "growwapi>=1.5.0",
    "nats-py>=2.0.0",
]

[project.optional-dependencies]
ml = [
    "xgboost>=2.1.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*Using .httpx. with .starlette.testclient..*:DeprecationWarning",
    "ignore:Use 'content=.*':DeprecationWarning",
    "ignore::DeprecationWarning:httpx",
    "ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning",
]

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + design gate + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run check` = typecheck && lint:design && test
      # The design gate is the important one: it fails the build if any raw
      # palette class, hex colour, `dark:` variant, or inline colour style is
      # reintroduced. Tailwind palette classes are retired by design.
      - name: Run check (typecheck + design gate + tests)
        run: npm run check
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  backend:
    # GATING. The suite is green (1613 passed) as of the data-truth + test
    # isolation pass: the previously failing 12 included a scikit-learn 1.7
    # API removal (`multi_class`), a tasks-vs-handlers race in the event-bus
    # test, two time/order-dependent tests (a hardcoded past expiry and a
    # prewarmed dashboard summary), and three paper/signal tests that only
    # passed when the ambient broker feed happened to be up.
    #
    # `continue-on-error` was removed with that fix. If this job goes red,
    # the regression is real — do not silence it again; fix it or revert.
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The `ml` extra is required: app/quant/* and app/ml/* import numpy,
      # polars and scikit-learn. Installing only `.[dev]` used to make the
      # whole ML/quant surface unexercisable in CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run tests
        run: python -m pytest tests -q

  truth-guard:
    # GATING, unlike the advisory backend job above. Truth-of-Wall enforcement:
    # scans runtime code for fabricated-data signatures (hardcoded spots,
    # FALLBACK_CALIBRATED, ungated mock AI, hardcoded IV maps). Needs no
    # dependencies installed — stdlib-only test — so it runs in seconds.
    name: No-fabrication gate [gating]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fabrication-signature scan
        run: python -m pytest tests/test_no_fabrication_signatures.py -q

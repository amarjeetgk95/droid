name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + design gate + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run check` = typecheck && lint:design && test
      # The design gate is the important one: it fails the build if any raw
      # palette class, hex colour, `dark:` variant, or inline colour style is
      # reintroduced. Tailwind palette classes are retired by design.
      - name: Run check (typecheck + design gate + tests)
        run: npm run check
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  backend:
    # ADVISORY, NOT GATING — on purpose.
    #
    # Baseline at the time of writing: 1228 passed, 19 failed, 6 skipped.
    # All 19 failures live in the in-progress "data-truth" refactor that is
    # currently uncommitted in the working tree (fsm.py, outcome_tracker.py,
    # transaction_costs.py, options_intelligence/selector.py, paper_engine.py,
    # fill_reconciler.py, plus the swing strategies). The affected tests are
    # still asserting the pre-refactor behaviour:
    #   test_financial_parity.py (7), test_signal_audit_domain_fixes.py (2),
    #   test_options_intelligence*.py (3), test_intraday_swing_*.py (3),
    #   test_signal_model_immutability.py (1), test_cost_aware_outcomes.py (1),
    #   test_expected_move.py (1), test_ollama.py (1)
    #
    # TODO: remove `continue-on-error` once that refactor lands and the suite
    # is green. Until then a red backend job would just train everyone to
    # ignore CI, which is worse than no CI.
    name: Backend (pytest) [advisory]
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

  truth-guard:
    # GATING, unlike the advisory backend job above. Truth-of-Wall enforcement:
    # scans runtime code for fabricated-data signatures (hardcoded spots,
    # FALLBACK_CALIBRATED, ungated mock AI, hardcoded IV maps). Needs no
    # dependencies installed — stdlib-only test — so it runs in seconds.
    name: No-fabrication gate [gating]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fabrication-signature scan
        run: python -m pytest tests/test_no_fabrication_signatures.py -q

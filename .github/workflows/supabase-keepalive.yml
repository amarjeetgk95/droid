name: Keep Supabase Active

on:
  schedule:
    # Runs every 3 days at 00:00 UTC (well within the 7-day inactivity limit)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keepalive:
    name: Ping Supabase Services
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set in GitHub repository secrets!"
            exit 1
          fi

      - name: Ping Supabase REST API
        run: |
          # Strip trailing slash from SUPABASE_URL if present
          BASE_URL="${{ secrets.SUPABASE_URL }}"
          BASE_URL="${BASE_URL%/}"
          
          echo "Pinging Supabase REST API at $(date -u)..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${BASE_URL}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "REST API HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Successfully pinged Supabase REST API."
          else
            echo "::warning::Unexpected HTTP status $HTTP_STATUS from REST API"
            echo "Response details: $BODY"
          fi

      - name: Ping Supabase Auth Service
        run: |
          BASE_URL="${{ secrets.SUPABASE_URL }}"
          BASE_URL="${BASE_URL%/}"
          
          echo "Pinging Supabase Auth Health..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET "${BASE_URL}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "Auth Service HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Successfully pinged Supabase Auth Service."
          else
            echo "::warning::Unexpected HTTP status $HTTP_STATUS from Auth Service"
            echo "Response details: $BODY"
          fi

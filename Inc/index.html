<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  .tf-btn.active{background:#2962ff;color:#fff;}
  .tool{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#b2b5be;cursor:pointer;border:0;background:transparent;}
  .tool:hover{background:#2a2e39;color:#fff;}
  .chip{font-size:11px;padding:1px 6px;border-radius:3px;}
</style>

<body class="select-none">
<div id="root"></div>

<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* =================== constants =================== */
const C = {
  bg:'#131722', grid:'#1e222d', axis:'#2a2e39', text:'#787b86',
  up:'#26a69a', down:'#ef5350', ma7:'#f0b90b', ma25:'#c026d3',
  line:'#2962ff', cross:'#758696'
};
const PAD_R = 66, PAD_B = 26, PAD_T = 58;

/* =================== data utils =================== */
function genData(intervalMin, n = 700){
  const step = intervalMin * 60 * 1000;
  const now = Math.floor(Date.now()/step)*step;
  let price = 62000 + Math.random()*4000;
  const out = [];
  const vol = 0.0022 * Math.sqrt(intervalMin);
  for(let i=n-1;i>=0;i--){
    const t = now - i*step;
    const drift = Math.sin(i/40)*0.0006 + (Math.random()-0.5)*vol*2;
    const o = price;
    const c = Math.max(100, o * (1 + drift));
    const wick = Math.abs(o-c) + o*vol*Math.random()*1.4;
    const h = Math.max(o,c) + wick*Math.random();
    const l = Math.min(o,c) - wick*Math.random();
    const v = (Math.abs(c-o)/o*90000 + Math.random()*900 + 200);
    out.push({t,o,h,l,c,v});
    price = c;
  }
  return out;
}
const fmtP = p => p.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtV = v => v>=1e6 ? (v/1e6).toFixed(2)+'M' : v>=1e3 ? (v/1e3).toFixed(1)+'K' : v.toFixed(0);
function fmtT(ts, tf){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,'0');
  if(tf>=1440) return d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
  return p(d.getUTCHours())+':'+p(d.getUTCMinutes());
}
function fmtFull(ts){
  const d=new Date(ts), p=n=>String(n).padStart(2,'0');
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes());
}
const sma = (arr, period, idx) => {
  if(idx < period-1) return null;
  let s=0; for(let i=idx-period+1;i<=idx;i++) s+=arr[i].c;
  return s/period;
};
function niceSteps(min,max,count){
  const raw = (max-min)/count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw/mag;
  const step = (norm>=5?5:norm>=2?2:1)*mag;
  const out=[]; let v = Math.ceil(min/step)*step;
  while(v<max){ out.push(v); v+=step; }
  return out;
}

/* =================== hook: useCandleData =================== */
function useCandleData(tf, live){
  const [data, setData] = useState(() => genData(tf));
  const tfRef = useRef(tf);
  useEffect(()=>{
    tfRef.current = tf;
    setData(genData(tf));
  }, [tf]);
  useEffect(()=>{
    if(!live) return;
    const id = setInterval(()=>{
      setData(prev => {
        if(!prev.length) return prev;
        const next = prev.map(d=>({...d}));
        const last = next[next.length-1];
        const step = tfRef.current*60*1000;
        const move = last.c * (Math.random()-0.5) * 0.0016;
        const np = Math.max(1, last.c + move);
        if(Date.now() - last.t >= step){
          next.push({t:last.t+step, o:last.c, h:Math.max(last.c,np), l:Math.min(last.c,np), c:np, v:Math.random()*800+200});
          if(next.length>1500) next.shift();
        } else {
          last.c = np; last.h = Math.max(last.h,np); last.l = Math.min(last.l,np); last.v += Math.random()*40;
        }
        return next;
      });
    }, 700);
    return () => clearInterval(id);
  }, [live]);
  return data;
}

/* =================== component: TopBar =================== */
function TopBar({ tf, setTf, chartType, setChartType, showMA, setShowMA, showVol, setShowVol, live, setLive, lastPrice, changePct, onReset }){
  const up = changePct >= 0;
  return (
    <header className="h-[42px] flex items-center gap-1 px-2 border-b border-[#2a2e39] bg-[#131722] shrink-0">
      <div className="flex items-center gap-2 pr-3 border-r border-[#2a2e39]">
        <div className="w-7 h-7 rounded-full bg-[#f7931a] grid place-items-center text-[13px] font-bold text-black">₿</div>
        <div className="leading-tight">
          <div className="text-[14px] font-semibold text-white">BTCUSDT</div>
          <div className="text-[10px] text-[#787b86] -mt-[2px]">Binance · Crypto</div>
        </div>
      </div>

      <div className="flex items-center gap-[2px] px-2 border-r border-[#2a2e39]">
        {[['1',1],['5',5],['15',15],['1H',60],['4H',240],['1D',1440]].map(([label,val])=>(
          <button key={val} className={'tf-btn'+(tf===val?' active':'')} onClick={()=>setTf(val)}>{label}</button>
        ))}
      </div>

      <div className="flex items-center gap-[2px] px-2 border-r border-[#2a2e39]">
        {['candle','line','area'].map(t=>(
          <button key={t} className={'tf-btn'+(chartType===t?' active':'')} onClick={()=>setChartType(t)}>
            {t[0].toUpperCase()+t.slice(1)}
          </button>
        ))}
      </div>

      <div className="flex items-center gap-[2px] px-2 border-r border-[#2a2e39]">
        <button className={'tf-btn'+(showMA?' active':'')} onClick={()=>setShowMA(v=>!v)}>MA 7/25</button>
        <button className={'tf-btn'+(showVol?' active':'')} onClick={()=>setShowVol(v=>!v)}>Volume</button>
        <button className={'tf-btn'+(live?' active':'')} onClick={()=>setLive(v=>!v)}>● Live</button>
      </div>

      <div className="ml-auto flex items-center gap-2 pr-1">
        <span className="text-[15px] font-semibold" style={{color:up?C.up:C.down}}>{fmtP(lastPrice)}</span>
        <span className="chip" style={{background: up?'rgba(38,166,154,.15)':'rgba(239,83,80,.15)', color: up?C.up:C.down}}>
          {up?'+':''}{changePct.toFixed(2)}%
        </span>
        <button className="tf-btn" onClick={onReset}>Reset</button>
      </div>
    </header>
  );
}

/* =================== component: SideTools =================== */
function SideTools(){
  const tools = [
    {t:'Cross', i:'✛'}, {t:'Trend line', i:'╱'}, {t:'Horizontal line', i:'━'},
    {t:'Rectangle', i:'▭'}, {t:'Text', i:'T'}, {t:'Measure', i:'⇕'}
  ];
  return (
    <aside className="w-[46px] border-r border-[#2a2e39] flex flex-col items-center py-2 gap-1 shrink-0">
      {tools.map(({t,i})=>(<div key={t} className="tool" title={t}>{i}</div>))}
      <div className="mt-auto tool" title="Settings">⚙</div>
    </aside>
  );
}

/* =================== component: Legend =================== */
function Legend({ data, hoverIdx, tf, showMA }){
  const d = data[hoverIdx];
  if(!d) return null;
  const up = d.c>=d.o;
  const col = up? C.up : C.down;
  const chg = ((d.c-d.o)/d.o*100).toFixed(2);
  const m7 = showMA ? sma(data,7,hoverIdx) : null;
  const m25 = showMA ? sma(data,25,hoverIdx) : null;
  const tfLabel = tf>=1440?'1D':tf>=60?(tf/60)+'H':tf+'m';
  return (
    <div className="absolute left-3 top-2 text-[12px] pointer-events-none leading-[18px]">
      <div className="font-semibold text-white mb-[2px]">BTCUSDT · {tfLabel} · Simulated</div>
      <div className="flex gap-2 flex-wrap">
        <span className="text-[#787b86]">O</span><span style={{color:col}}>{fmtP(d.o)}</span>
        <span className="text-[#787b86]">H</span><span style={{color:col}}>{fmtP(d.h)}</span>
        <span className="text-[#787b86]">L</span><span style={{color:col}}>{fmtP(d.l)}</span>
        <span className="text-[#787b86]">C</span><span style={{color:col}}>{fmtP(d.c)}</span>
        <span style={{color:col}}>{up?'+':''}{chg}%</span>
        <span className="text-[#787b86]">Vol</span><span style={{color:col}}>{fmtV(d.v)}</span>
      </div>
      {showMA && (
        <div className="flex gap-3 mt-[2px]">
          <span style={{color:C.ma7}}>MA7 {m7?fmtP(m7):'—'}</span>
          <span style={{color:C.ma25}}>MA25 {m25?fmtP(m25):'—'}</span>
        </div>
      )}
    </div>
  );
}

/* =================== component: StatusBar =================== */
function StatusBar({ data, view }){
  const [clock, setClock] = useState('--:--:--');
  useEffect(()=>{
    const p = n=>String(n).padStart(2,'0');
    const tick = () => { const d=new Date(); setClock(p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())); };
    tick();
    const id = setInterval(tick, 1000);
    return ()=>clearInterval(id);
  }, []);
  return (
    <footer className="h-[26px] flex items-center px-3 gap-4 text-[11px] text-[#787b86] border-t border-[#2a2e39] shrink-0">
      <span>{clock}</span>
      <span>UTC</span>
      <span className="ml-auto">{Math.round(view.count)} bars visible · {data.length} loaded · O/H/L/C simulated</span>
    </footer>
  );
}

/* =================== component: ChartCanvas =================== */
function ChartCanvas({ data, tf, chartType, showMA, showVol, view, setView, onHover, onReset }){
  const cvsRef = useRef(null);
  const wrapRef = useRef(null);
  const mouseRef = useRef({ x:null, y:null, inside:false });
  const dragRef = useRef(null);
  const [, force] = useState(0);

  const plotW = useRef(0), plotH = useRef(0);

  /* resize */
  useEffect(()=>{
    const cvs = cvsRef.current, wrap = wrapRef.current;
    const ro = new ResizeObserver(()=>{
      const r = wrap.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      plotW.current = r.width - PAD_R;
      plotH.current = r.height - PAD_B;
      cvs.width = r.width*dpr; cvs.height = r.height*dpr;
      cvs.style.width = r.width+'px'; cvs.style.height = r.height+'px';
      cvs.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
      drawRef.current?.();
    });
    ro.observe(wrap);
    return ()=>ro.disconnect();
    // eslint-disable-next-line
  }, []);

  /* draw whenever inputs change */
  const drawRef = useRef(null);
  const draw = useCallback(()=>{
    const cvs = cvsRef.current;
    if(!cvs) return;
    const ctx = cvs.getContext('2d');
    const W = plotW.current + PAD_R, H = plotH.current + PAD_B;
    if(W<=0||H<=0) return;

    const s = Math.max(0, Math.floor(view.start));
    const e = Math.min(data.length, Math.ceil(view.start + view.count));
    const slice = data.slice(s,e);
    if(!slice.length) return;

    const volH  = showVol ? plotH.current*0.18 : 0;
    const priceTop = PAD_T, priceBot = plotH.current - volH - 6;

    ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,H);

    let min=Infinity,max=-Infinity,vmax=0;
    slice.forEach(d=>{ min=Math.min(min,d.l); max=Math.max(max,d.h); vmax=Math.max(vmax,d.v); });
    if(showMA){
      for(let i=s;i<e;i++){ const a=sma(data,7,i), b=sma(data,25,i);
        if(a){min=Math.min(min,a);max=Math.max(max,a);} if(b){min=Math.min(min,b);max=Math.max(max,b);} }
    }
    const pad = (max-min)*0.08 || 1; min-=pad; max+=pad;

    const barW = plotW.current / view.count;
    const xOf = i => (i - view.start) * barW + barW/2;
    const yOf = p => priceTop + (max-p)/(max-min) * (priceBot-priceTop);
    const pOf = y => max - (y-priceTop)/(priceBot-priceTop)*(max-min);

    /* price grid */
    ctx.font = '11px -apple-system, sans-serif';
    ctx.textBaseline = 'middle';
    const steps = niceSteps(min,max,Math.max(3,Math.floor((priceBot-priceTop)/56)));
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
    steps.forEach(p=>{
      const y = Math.round(yOf(p))+0.5;
      if(y<priceTop-10||y>priceBot) return;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(plotW.current,y); ctx.stroke();
      ctx.fillStyle = C.text; ctx.textAlign='left';
      ctx.fillText(fmtP(p), plotW.current+8, y);
    });

    /* time grid */
    const tickEvery = Math.max(1, Math.round(view.count/8));
    ctx.textAlign='center';
    for(let i=s;i<e;i++){
      if(i % tickEvery) continue;
      const x = Math.round(xOf(i))+0.5;
      if(x<0||x>plotW.current) continue;
      ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,plotH.current); ctx.stroke();
      ctx.fillStyle = C.text; ctx.fillText(fmtT(data[i].t, tf), x, plotH.current+13);
    }

    /* volume */
    if(showVol){
      for(let i=s;i<e;i++){
        const d = data[i];
        const h = (d.v/vmax) * (volH-4);
        const x = xOf(i) - barW*0.35;
        ctx.fillStyle = (d.c>=d.o? C.up : C.down) + '55';
        ctx.fillRect(x, plotH.current-h, Math.max(1,barW*0.7), h);
      }
    }

    /* series */
    if(chartType === 'candle'){
      const bw = Math.max(1, barW*0.7);
      for(let i=s;i<e;i++){
        const d = data[i], up = d.c>=d.o;
        const x = xOf(i);
        ctx.strokeStyle = up?C.up:C.down; ctx.fillStyle = up?C.up:C.down;
        ctx.beginPath();
        ctx.moveTo(Math.round(x)+0.5, yOf(d.h)); ctx.lineTo(Math.round(x)+0.5, yOf(d.l)); ctx.stroke();
        const y1 = yOf(Math.max(d.o,d.c)), y2 = yOf(Math.min(d.o,d.c));
        if(bw<=1.6) ctx.fillRect(Math.round(x), y1, 1, Math.max(1,y2-y1));
        else ctx.fillRect(Math.round(x-bw/2), Math.round(y1), Math.round(bw), Math.max(1, Math.round(y2-y1)));
      }
    } else {
      ctx.beginPath();
      for(let i=s;i<e;i++){ const x=xOf(i), y=yOf(data[i].c); i===s?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      if(chartType==='area'){
        const g = ctx.createLinearGradient(0,priceTop,0,priceBot);
        g.addColorStop(0,'rgba(41,98,255,.35)'); g.addColorStop(1,'rgba(41,98,255,0)');
        ctx.lineTo(xOf(e-1), priceBot); ctx.lineTo(xOf(s), priceBot); ctx.closePath();
        ctx.fillStyle = g; ctx.fill();
        ctx.beginPath();
        for(let i=s;i<e;i++){ const x=xOf(i), y=yOf(data[i].c); i===s?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      }
      ctx.strokeStyle = C.line; ctx.lineWidth = 1.6; ctx.stroke(); ctx.lineWidth = 1;
    }

    /* moving averages */
    if(showMA){
      [[7,C.ma7],[25,C.ma25]].forEach(([p,col])=>{
        ctx.beginPath(); let started=false;
        for(let i=s;i<e;i++){ const m=sma(data,p,i); if(m==null) continue;
          const x=xOf(i), y=yOf(m); started?ctx.lineTo(x,y):(ctx.moveTo(x,y),started=true); }
        ctx.strokeStyle=col; ctx.lineWidth=1.3; ctx.stroke(); ctx.lineWidth=1;
      });
    }

    /* last price line */
    const last = data[data.length-1];
    const ly = yOf(last.c);
    if(ly>priceTop && ly<priceBot){
      ctx.setLineDash([4,4]); ctx.strokeStyle = last.c>=last.o?C.up:C.down;
      ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(plotW.current,ly); ctx.stroke(); ctx.setLineDash([]);
      tag(ctx, plotW.current, ly, fmtP(last.c), last.c>=last.o?C.up:C.down, '#fff');
    }

    /* axes */
    ctx.strokeStyle = C.axis;
    ctx.beginPath(); ctx.moveTo(plotW.current+0.5,0); ctx.lineTo(plotW.current+0.5,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,plotH.current+0.5); ctx.lineTo(W,plotH.current+0.5); ctx.stroke();

    /* crosshair + hover */
    let hoverIdx = data.length-1;
    const m = mouseRef.current;
    if(m.inside && m.x < plotW.current && m.y < plotH.current){
      hoverIdx = Math.round(view.start + (m.x - barW/2)/barW);
      hoverIdx = Math.max(0, Math.min(data.length-1, hoverIdx));
      const cx = Math.round(xOf(hoverIdx))+0.5;
      ctx.setLineDash([3,3]); ctx.strokeStyle = C.cross;
      ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,plotH.current); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,m.y+0.5); ctx.lineTo(plotW.current,m.y+0.5); ctx.stroke();
      ctx.setLineDash([]);
      tag(ctx, plotW.current, m.y, fmtP(pOf(m.y)), '#363a45', '#d1d4dc');
      const label = fmtFull(data[hoverIdx].t);
      ctx.font='11px sans-serif'; const tw = ctx.measureText(label).width+12;
      ctx.fillStyle='#363a45'; ctx.fillRect(cx-tw/2, plotH.current+2, tw, 18);
      ctx.fillStyle='#d1d4dc'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(label, cx, plotH.current+11);
    }
    onHover(hoverIdx);
  }, [data, tf, chartType, showMA, showVol, view, onHover]);
  drawRef.current = draw; // always point to latest version

  useEffect(()=>{ draw(); }, [draw]);

  /* mouse handlers (use refs, trigger redraw via rAF) */
  const scheduleRedraw = useRef(0);
  const redrawNextFrame = () => {
    if(scheduleRedraw.current) return;
    scheduleRedraw.current = requestAnimationFrame(()=>{
      scheduleRedraw.current = 0;
      drawRef.current?.();
    });
  };

  const onMouseMove = (ev)=>{
    const r = cvsRef.current.getBoundingClientRect();
    mouseRef.current.x = ev.clientX - r.left;
    mouseRef.current.y = ev.clientY - r.top;
    mouseRef.current.inside = true;
    if(dragRef.current){
      const dx = mouseRef.current.x - dragRef.current.x;
      const barW = plotW.current / view.count;
      const ns = dragRef.current.start - dx/barW;
      setView(v => ({ ...v, start: Math.max(-v.count*0.15, Math.min(data.length - v.count*0.7, ns)) }));
    }
    redrawNextFrame();
  };
  const onMouseLeave = () => { mouseRef.current.inside = false; dragRef.current = null; redrawNextFrame(); };
  const onMouseDown = (ev)=>{
    const r = cvsRef.current.getBoundingClientRect();
    dragRef.current = { x: ev.clientX - r.left, start: view.start };
    cvsRef.current.style.cursor = 'grabbing';
  };
  const onMouseUp = () => { dragRef.current = null; if(cvsRef.current) cvsRef.current.style.cursor='crosshair'; };

  const onWheel = (ev)=>{
    ev.preventDefault();
    const r = cvsRef.current.getBoundingClientRect();
    const px = (ev.clientX-r.left)/plotW.current;
    const factor = ev.deltaY>0 ? 1.12 : 0.89;
    setView(v => {
      const newCount = Math.max(20, Math.min(data.length, v.count*factor));
      const anchor = v.start + px*v.count;
      const ns = anchor - px*newCount;
      return { count: newCount, start: Math.max(-newCount*0.15, Math.min(data.length - newCount*0.7, ns)) };
    });
    redrawNextFrame();
  };
  const onDbl = () => onReset();

  return (
    <div ref={wrapRef} className="flex-1 relative min-w-0">
      <canvas
        ref={cvsRef}
        onMouseMove={onMouseMove}
        onMouseLeave={onMouseLeave}
        onMouseDown={onMouseDown}
        onMouseUp={onMouseUp}
        onWheel={onWheel}
        onDoubleClick={onDbl}
        style={{cursor:'crosshair'}}
      />
    </div>
  );
}

function tag(ctx, x, y, text, bg, fg){
  ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle = bg; ctx.fillRect(x+1, y-9, PAD_R-2, 18);
  ctx.fillStyle = fg; ctx.fillText(text, x+8, y);
}

/* =================== App =================== */
function App(){
  const [tf, setTf] = useState(60);
  const [chartType, setChartType] = useState('candle');
  const [showMA, setShowMA] = useState(true);
  const [showVol, setShowVol] = useState(true);
  const [live, setLive] = useState(true);
  const [view, setView] = useState({ start: 0, count: 120 });
  const [hoverIdx, setHoverIdx] = useState(null);

  const data = useCandleData(tf, live);

  // keep view pinned to latest bars
  useEffect(()=>{
    if(!data.length) return;
    setView(v => {
      const end = v.start + v.count;
      if(end >= data.length - 2){
        return { ...v, start: data.length - v.count + 8 };
      }
      return v;
    });
  }, [data.length]);

  const lastPrice = data.length ? data[data.length-1].c : 0;
  const changePct = data.length>1 ? (data[data.length-1].c - data[Math.max(0,data.length-25)].c) / data[Math.max(0,data.length-25)].c * 100 : 0;

  const reset = useCallback(()=>{
    setView({ count: Math.min(140, data.length), start: Math.max(0, data.length - 140 + 8) });
  }, [data.length]);

  // initial view
  useEffect(()=>{
    if(data.length && view.count === 120 && view.start === 0) reset();
    // eslint-disable-next-line
  }, [data.length]);

  const onHover = useCallback(i => setHoverIdx(prev => prev===i?prev:i), []);

  return (
    <div className="h-screen w-screen flex flex-col">
      <TopBar
        tf={tf} setTf={setTf}
        chartType={chartType} setChartType={setChartType}
        showMA={showMA} setShowMA={setShowMA}
        showVol={showVol} setShowVol={setShowVol}
        live={live} setLive={setLive}
        lastPrice={lastPrice}
        changePct={changePct}
        onReset={reset}
      />
      <div className="flex-1 flex min-h-0">
        <SideTools />
        <main className="flex-1 relative min-w-0 flex">
          <ChartCanvas
            data={data} tf={tf}
            chartType={chartType} showMA={showMA} showVol={showVol}
            view={view} setView={setView}
            onHover={onHover} onReset={reset}
          />
          <Legend data={data} hoverIdx={hoverIdx ?? data.length-1} tf={tf} showMA={showMA} />
          <div className="absolute right-[70px] bottom-[34px] flex flex-col gap-1">
            <button className="w-7 h-7 rounded bg-[#1e222d] border border-[#2a2e39] text-[#b2b5be] hover:text-white text-sm"
              onClick={()=>setView(v=>({...v, count:Math.max(20,v.count*0.8)}))}>+</button>
            <button className="w-7 h-7 rounded bg-[#1e222d] border border-[#2a2e39] text-[#b2b5be] hover:text-white text-sm"
              onClick={()=>setView(v=>({...v, count:Math.min(data.length,v.count*1.25)}))}>−</button>
          </div>
          <div className="absolute left-3 bottom-[30px] text-[10px] text-[#5d606b] pointer-events-none">
            scroll = zoom · drag = pan · double-click = reset
          </div>
        </main>
      </div>
      <StatusBar data={data} view={view} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
